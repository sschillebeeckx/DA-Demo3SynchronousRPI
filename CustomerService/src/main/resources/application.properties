spring.application.name=CustomerService
server.port=8081
spring.datasource.url=jdbc:h2:file:./CustomerService/data/customers;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=h2user1
spring.datasource.password=h2pass1

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
#open api yaml to be found at http://localhost:8081/api-docs.yaml
#swagger-doc at http://localhost:8081/swagger-ui/index.html