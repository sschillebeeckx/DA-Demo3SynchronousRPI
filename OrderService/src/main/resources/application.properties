spring.application.name=order-service
server.port=8084
spring.datasource.url=jdbc:h2:file:./OrderService/data/orders;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=h2user4
spring.datasource.password=h2pass4

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#caching parameters used in circuit breaker menuitemproxy
spring.cache.type=caffeine
spring.cache.cache-names=menu-items
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

#setup for service discovery, use spring.application.name now to discover in delivery service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/